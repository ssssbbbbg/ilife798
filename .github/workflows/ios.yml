name: iOS Build and Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XCODE_SCHEME: iosApp
  XCODE_PROJECT: iosApp/iosApp.xcodeproj

jobs:
  validate:
    name: Validate iOS build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          SIGN_SALT: ${{ secrets.SIGN_SALT }}
          API_CID: ${{ secrets.API_CID }}
        run: |
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'SIGN_SALT=%s\n' "$SIGN_SALT" >> secrets.properties
          printf 'API_CID=%s\n' "$API_CID" >> secrets.properties

      - name: Compile Kotlin iOS framework
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace

      - name: Build iOS app (unsigned, simulator)
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            EXCLUDED_ARCHS=x86_64 \
            build

  release:
    name: Build and publish iOS release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          SIGN_SALT: ${{ secrets.SIGN_SALT }}
          API_CID: ${{ secrets.API_CID }}
        run: |
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'SIGN_SALT=%s\n' "$SIGN_SALT" >> secrets.properties
          printf 'API_CID=%s\n' "$API_CID" >> secrets.properties

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ILife798.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXCLUDED_ARCHS=x86_64 \
            archive

      - name: Export unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/ILife798.xcarchive/Products/Applications/ILife798.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/export/Payload/"
          cd "$RUNNER_TEMP/export"
          ditto -c -k --sequesterRsrc --keepParent "Payload" "ILife798.ipa"
          ls -la "$RUNNER_TEMP/export/ILife798.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ilife798-${{ github.ref_name }}-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ipa[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ipa[@]}" --generate-notes
          fi
